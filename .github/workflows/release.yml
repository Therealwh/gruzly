name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint · Typecheck · Tests
    uses: ./.github/workflows/quality.yml

  create-release:
    name: Create GitHub release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # Drafts are not returned by the tag endpoint, and a moved tag can
          # leave one draft plus one published release behind. List first and
          # prefer the published release. gh api prints a JSON error body on
          # stdout when it fails, so keep only a purely numeric id.
          list_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq "$1" 2>/dev/null | head -n1 || true
          }
          release_id=$(list_id '.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | select(.draft==false) | .id')
          case "$release_id" in ''|*[!0-9]*) release_id="" ;; esac
          if [ -z "$release_id" ]; then
            release_id=$(list_id '.[] | select(.tag_name=="'"$GITHUB_REF_NAME"'") | .id')
            case "$release_id" in ''|*[!0-9]*) release_id="" ;; esac
          fi
          if [ -z "$release_id" ]; then
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id 2>/dev/null || true)
            case "$release_id" in ''|*[!0-9]*) release_id="" ;; esac
          fi
          if [ -z "$release_id" ]; then
            release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="Gruzly $GITHUB_REF_NAME" \
              -f body="See CHANGELOG.md for release notes. Download only content you own or have permission to save. Gruzly does not support or circumvent DRM." \
              -F draft=true \
              -F prerelease=false \
              --jq .id 2>/dev/null || true)
            case "$release_id" in ''|*[!0-9]*) release_id="" ;; esac
          fi
          if [ -z "$release_id" ]; then
            echo "Could not resolve the release for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Publish (${{ matrix.os }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Sequential uploads let each platform merge its entry into latest.json
      # without racing the others.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_args: "--target x86_64-pc-windows-msvc --bundles nsis,msi"
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle_args: "--target aarch64-apple-darwin --bundles app"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev aria2
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install aria2 ffmpeg
      - run: npm ci
      - name: Fetch sidecar engines
        run: npm run engines:fetch
      - name: Build, sign and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.bundle_args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "Gruzly ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md. Download only content you own or have permission to save. Gruzly does not support or circumvent DRM."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Assemble portable (Windows)
        if: runner.os == 'Windows'
        run: npm run package:portable
      - name: Upload portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          $name = 'Gruzly-portable-win64.zip'
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets" --jq ".[] | select(.name=='$name') | .id"
          if ($existing) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$existing"
          }
          gh api --method POST "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$name" `
            -H "Content-Type: application/zip" `
            --input portable/Gruzly-portable-win64.zip | Out-Null
          Write-Host "Uploaded $name"

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the prepared draft as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          python3 - "$GITHUB_REF_NAME" > release.json <<'PY'
          import json, re, sys

          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.S | re.M,
          )
          body = match.group(1).strip() if match else f"See CHANGELOG.md for {version}."
          print(json.dumps({"body": body, "draft": False, "make_latest": "true"}))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input release.json
