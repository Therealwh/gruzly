[package]
name = "gruzly"
version = "0.3.6"
description = "Gruzly — download manager: files, torrents and video"
authors = ["Gruzly contributors"]
license = "MIT"
repository = "https://github.com/Therealwh/gruzly"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gruzly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
thiserror = "2"
sha1 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
tauri-plugin-deep-link = "2"
# Archive extraction. Keep the feature sets minimal: ZIP only decodes
# Deflate/Stored entries, 7z only needs its default LZMA/LZMA2 decoders.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
sevenz-rust = { version = "0.6.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.11"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
